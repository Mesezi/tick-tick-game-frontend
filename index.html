    <meta charset="UTF-8" />

    <!-- SEO -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tick Tick — Free Online Multiplayer Word Game" />

    <!-- PWA -->
    <meta name="theme-color" content="#6b4423" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tick Tick" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #4a3520;
      }

      html,
      body,
      #root {
        background: #4a3520;
      }

      body {
        min-height: 100dvh;
        padding:
          max(0.75rem, env(safe-area-inset-top))
          max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom))
          max(0.75rem, env(safe-area-inset-left));
        box-sizing: border-box;
      }

      #root {
        min-height: 100dvh;
      }

      .startup-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        z-index: 10;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #4a3520;
        color: #8b5e3c;
        font: bold 18px system-ui, sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      html.app-ready .startup-fallback {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .startup-fallback img {
        width: 7rem;
        filter: drop-shadow(0 4px 20px rgba(107, 68, 35, 0.3));
      }

      .startup-fallback-dots {
        display: flex;
        gap: 0.5rem;
      }

      .startup-fallback-dots span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentColor;
        animation: startup-pulse 1.2s ease-in-out infinite;
      }

      .startup-fallback-dots span:nth-child(2) {
        animation-delay: 0.22s;
      }

      .startup-fallback-dots span:nth-child(3) {
        animation-delay: 0.44s;
      }

      @keyframes startup-pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }

        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
    </style>
    <link rel="apple-touch-startup-image" href="/apple-splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Tick Tick",
      "url": "https://playticktick.com/",
      "image": "https://playticktick.com/pwa-512.png",
      "description": "Play Tick Tick, the free Nigerian multiplayer word game. Pick a letter and race to fill every category before someone shouts STOP.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "genre": "Word Game",
      "gamePlatform": "Web Browser"
    }
    </script>
  </head>
  <body>
    <div class="startup-fallback" role="status" aria-label="Loading Tick Tick">
      <img src="/tick-tick-logo.png" alt="" />
      <div class="startup-fallback-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span>Loading...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
